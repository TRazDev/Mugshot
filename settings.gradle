plugins {
  id 'com.gradle.develocity' version '4.4.1'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

develocity {
  buildScan {
    termsOfUseUrl = 'https://gradle.com/help/legal-terms-of-use'
    if (System.getenv('CI') == 'true') {
      termsOfUseAgree = 'yes'
      tag 'CI'
    } else {
      publishing.onlyIf { false }
    }
  }
}

rootProject.name = 'mugshot-root'

include ':mugshot'
include ':mugshot-annotations'
include ':mugshot-gradle-plugin'
include ':mugshot-preview-junit'
include ':mugshot-preview-lints'
include ':mugshot-preview-processor'
include ':mugshot-preview-runtime'

include ':sample'

enableFeaturePreview('TYPESAFE_PROJECT_ACCESSORS')

includeBuild('build-logic') {
  dependencySubstitution {
    substitute module('uk.co.fractalmotion.mugshot:mugshot-gradle-plugin') using project(':mugshot-gradle-plugin')
    substitute module('uk.co.fractalmotion.mugshot:aar2jar') using project(':aar2jar')
  }
}

// Some of the test projects are intentionally supposed to fail. Don't import these into the main project.
def brokenProjects = [
  "missing-supported-plugins", // intentionally does not import
  "multiplatform-mugshot-in-commontest", // intentionally throws on invalid configuration
]
def testProjectNames = []
new File(rootDir, "mugshot-gradle-plugin/src/test/projects").eachDir {
  def dirName = it.name
  if (!dirName.startsWith(".") && !brokenProjects.contains(dirName)) {
    testProjectNames += dirName
  }
}

def isIdea = !(System.getProperty("idea.version") ?: "").isEmpty()
if (isIdea) {
  System.setProperty("uk.co.fractalmotion.mugshot.testProjectNames", testProjectNames.join(","))
  includeTestProjectsIntoIDE(testProjectNames)
}

private void includeTestProjectsIntoIDE(ArrayList<String> testProjectNames) {
  include(":test-projects")
  project(":test-projects").projectDir = new File(rootDir, "mugshot-gradle-plugin/src/test/projects")

  testProjectNames.forEach { dirName ->
    include ":test-projects:$dirName"
    project(":test-projects:$dirName").projectDir = new File(rootDir, "mugshot-gradle-plugin/src/test/projects/$dirName")
  }
}
