plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'com.google.devtools.ksp'
  id 'uk.co.fractalmotion.mugshot'
}

android {
  namespace = 'uk.co.fractalmotion.mugshot.plugin.test'
  compileSdk = libs.versions.compileSdk.get() as int
  defaultConfig {
    minSdk = libs.versions.minSdk.get() as int
  }
  compileOptions {
    sourceCompatibility = libs.versions.javaTarget.get()
    targetCompatibility = libs.versions.javaTarget.get()
  }
  buildFeatures {
    compose = true
  }
  testFixtures {
    enable = true
  }
}

dependencies {
  implementation libs.composeUi.material
  implementation libs.composeUi.uiToolingPreview
  // The Compose compiler plugin runs on the fixtures compilation too, and refuses to compile
  // without a runtime on its class path -- unrelated to what this fixture is testing.
  testFixturesImplementation libs.composeUi.material
}
