site_name: Mugshot
site_url: https://trazdev.github.io/Mugshot/
repo_name: Mugshot
repo_url: https://github.com/TRazDev/Mugshot
site_description: "Android screenshots without Android"
site_author: Fractal Motion
remote_branch: gh-pages

copyright: 'Copyright &copy; 2019 Square, Inc. &middot; Copyright &copy; 2026 Fractal Motion'

theme:
  name: 'material'
  favicon: images/icon-square.png
  logo: images/icon-square.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: 'light blue'
      accent: 'blue'
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: 'light blue'
      accent: 'blue'
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - 'css/app.css'

markdown_extensions:
  - smarty
  - codehilite:
      guess_lang: false
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - tables

nav:
  - 'Overview': index.md
  - 'API': api/mugshot/uk.co.fractalmotion.mugshot/index.html
  - 'Change Log': changelog.md
  - 'Code of Conduct': code_of_conduct.md

