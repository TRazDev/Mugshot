apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'uk.co.fractalmotion.mugshot'
apply plugin: 'jacoco'

android {
  namespace = 'uk.co.fractalmotion.mugshot.sample'

  compileSdk = libs.versions.compileSdk.get() as int
  defaultConfig {
    minSdk = libs.versions.minSdk.get() as int
    resValue("string", "generated_string_name", "Generated Test String")
  }
  compileOptions {
    sourceCompatibility = libs.versions.javaTarget.get()
    targetCompatibility = libs.versions.javaTarget.get()
  }
  buildFeatures {
    compose = true
    resValues = true
  }
}

// Disable unnecessary release build type
androidComponents {
  beforeVariants(selector().withBuildType("release")) { enable = false }
}

ksp {
  arg("uk.co.fractalmotion.mugshot.preview.namespace", "uk.co.fractalmotion.mugshot.sample")
}

dependencies {
  implementation libs.androidx.compose.ui.android
  implementation libs.composeUi.material3.android
  implementation libs.composeUi.material.icons
  implementation libs.composeUi.uiTooling
  implementation libs.composeUi.uiToolingPreview
  implementation libs.androidx.appcompat

  // TODO: wire via plugin
  implementation projects.mugshotAnnotations
  implementation projects.mugshotPreviewRuntime
  // Scoped to the debug variant so the processor never runs for the unit test compilation, where it
  // would generate a second MugshotPreviews.kt declaring the same top level val.
  kspDebug projects.mugshotPreviewProcessor
  lintChecks projects.mugshotPreviewLints

  testImplementation libs.testParameterInjector
}

// https://github.com/diffplug/spotless/issues/1572
tasks.withType(com.diffplug.gradle.spotless.SpotlessTask).configureEach {
  mustRunAfter(tasks.withType(Test))
}

// Verify screenshots as part of the standard check process
tasks.named("check").configure {
  dependsOn("verifyMugshot")
}
