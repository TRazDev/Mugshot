import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
  repositories {
    mavenCentral()
    google()
    gradlePluginPortal()
  }

  dependencies {
    classpath libs.plugin.kotlin
    classpath libs.plugin.android
    classpath libs.plugin.buildConfig
  }
}

subprojects {
  repositories {
    mavenCentral()
    google()
  }

  tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = libs.versions.javaTarget.get()
    targetCompatibility = libs.versions.javaTarget.get()
  }

  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions {
      jvmTarget = JvmTarget.fromTarget(libs.versions.javaTarget.get())
    }
  }
}

// ':mugshot-gradle-plugin' points at ../mugshot-gradle-plugin -- the very same directory the
// main build compiles. Without a separate output directory the two builds overwrite each
// other's generated BuildConfig (VERSION is "unspecified" here vs. VERSION_NAME there), which
// invalidated the configuration cache and forced a Kotlin recompile on every single run.
project(':mugshot-gradle-plugin') {
  layout.buildDirectory.set(new File(rootDir, 'build/mugshot-gradle-plugin'))
}
