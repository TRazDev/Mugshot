apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'java-gradle-plugin'

repositories {
  mavenCentral()
  google()
}

dependencies {
  compileOnly gradleApi()
  implementation libs.plugin.android
}

gradlePlugin {
  plugins {
    aar2jar {
      id = 'aar2jar'
      implementationClass = 'uk.co.fractalmotion.mugshot.gradle.Aar2JarPlugin'
    }
  }
}
