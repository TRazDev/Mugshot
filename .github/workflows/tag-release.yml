name: tag release

# Tags a release once its preparation commit reaches main, so the tag can never
# point at the wrong commit or carry a version the repository does not agree with.
on:
  push:
    branches:
      - main

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  tag:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for a release version
        id: check
        run: |
          set -euo pipefail

          # gradle.properties is the source of truth, not the commit subject. Squash
          # merges, merge commits and direct pushes all produce different subjects, and
          # none of them should decide whether a release happens.
          version="$(sed -nE 's/^VERSION_NAME=(.*)$/\1/p' gradle.properties)"

          case "$version" in
            ""|*-SNAPSHOT)
              echo "Nothing to release, VERSION_NAME is '$version'"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # main sits on a release version from the moment the preparation lands until
          # the next development version does, so other pushes land in that window and
          # must not fail.
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version is already tagged"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Releasing $version"
          failed=0

          if ! grep -q "^## \[$version\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated section for $version"
            failed=1
          fi

          if ! grep -q "$version" README.md; then
            echo "::error::README.md still shows an older version in its install snippets"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

  release:
    needs: tag
    if: needs.tag.outputs.release == 'true'
    # A called workflow cannot ask for more than its caller was granted, and this
    # repository defaults workflow tokens to read only. Without this the run fails
    # to start at all, because release.yml needs contents: write to publish.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.version }}
    secrets: inherit
