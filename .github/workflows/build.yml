name: build

on:
  pull_request: {}

  # Only main. PR branches are covered by pull_request, and a second trigger here
  # would run every job twice for one push.
  push:
    branches:
      - main

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [
          # Check https://github.com/actions/runner-images?tab=readme-ov-file#available-images for actual versions for latest
          macOS-latest,
          windows-latest,
          ubuntu-latest
        ]
        java-version: [21, 24]

    runs-on: ${{matrix.os}}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run All Tests
        run: ./gradlew check

      - name: Upload Test Failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-failures-${{ matrix.os }}-${{ matrix.java-version }}
          path: |
            **/build/reports/tests/*/
            **/build/mugshot/failures/
            mugshot-gradle-plugin/src/test/projects/**/build/reports/mugshot/**/images/
            mugshot-gradle-plugin/src/test/projects/**/build/reports/configuration-cache/**/

  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # A release preparation commit carries a non-SNAPSHOT version, and releasing it is
      # release.yml's job. Publishing here as well would race it for the same coordinates.
      - name: Check for a snapshot version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^VERSION_NAME=(.*)$/\1/p' gradle.properties)"
          case "$version" in
            *-SNAPSHOT) echo "snapshot=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Skipping, $version is not a snapshot" ; echo "snapshot=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish Snapshot
        if: steps.version.outputs.snapshot == 'true'
        run: ./gradlew publishMavenPublicationToMavenCentralRepository mugshot-gradle-plugin:publishAllPublicationsToMavenCentralRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SECRET_PASSPHRASE }}
