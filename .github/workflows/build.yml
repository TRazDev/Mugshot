name: build

on:
  pull_request: {}

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [
          # Check https://github.com/actions/runner-images?tab=readme-ov-file#available-images for actual versions for latest
          macOS-latest,
          windows-latest,
          ubuntu-latest
        ]
        java-version: [21, 24]

    runs-on: ${{matrix.os}}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run All Tests
        # Signing is only needed to publish to Maven Central, which release.yml does with the
        # key in its environment. The plugin tests resolve Mugshot from a local repository, and
        # publishing there pulls in the signing tasks once the version is not a SNAPSHOT, so a
        # release preparation branch would otherwise fail here for want of a key.
        run: ./gradlew check -PRELEASE_SIGNING_ENABLED=false

      - name: Upload Test Failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-failures-${{ matrix.os }}-${{ matrix.java-version }}
          path: |
            **/build/reports/tests/*/
            **/build/mugshot/failures/
            mugshot-gradle-plugin/src/test/projects/**/build/reports/mugshot/**/images/
            mugshot-gradle-plugin/src/test/projects/**/build/reports/configuration-cache/**/

  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish Artifacts
        run: ./gradlew publishMavenPublicationToMavenCentralRepository mugshot-gradle-plugin:publishAllPublicationsToMavenCentralRepository
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SECRET_PASSPHRASE }}
